services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=sqlite:////app/data/leadly.db
      - CORS_ORIGINS=http://localhost:3000
      - AI_PROVIDER=ollama
      - AI_MODE=${AI_MODE:-LOCAL_LIGHT}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-please-32chars-min}
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - OWNER_EMAIL=${OWNER_EMAIL:-owner@leadly.local}
      - OWNER_PASSWORD=${OWNER_PASSWORD:-changeme123}
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # For NVIDIA GPUs, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  backend_data:
  ollama_data:
